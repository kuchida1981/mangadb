[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "Kosuke Uchida",email = "byebyeearthjpn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.32.4,<3.0.0)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mangadb = 'app.main:main'

[tool.poetry.group.dev.dependencies]
mypy = "^1.16.1"
ruff = "^0.12.2"
types-requests = "^2.32.4.20250611"
black = "^25.1.0"

[tool.black]
line-length = 120

[tool.ruff]
lint.select = ["TID252", "S101"]
